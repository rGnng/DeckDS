<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · DeckDS Web Config</title>
  <link rel="stylesheet" href="/bootstrap.min.css">
  <link rel="stylesheet" href="/config.css">
  <script defer src="/login.js"></script>
</head>
<body class="bg-body-tertiary">
  <dialog id="sign-in-dialog" aria-labelledby="sign-in-title">
    <form id="sign-in-form" class="p-3 p-sm-4">
      <img class="deck-logo mb-3" src="/logo.svg" alt="DeckDS" width="116" height="35">
      <h1 class="h5 mb-3" id="sign-in-title">Sign in to Web Config</h1>
      <label class="form-label" for="sign-in-password">Password</label>
      <input id="sign-in-password" class="form-control" type="password" autocomplete="current-password"
             maxlength="128" required autofocus>
      <p id="sign-in-error" class="feedback text-danger small mt-2 mb-0" role="alert"></p>
      <div class="d-flex justify-content-end mt-3">
        <button id="sign-in-submit" class="btn btn-primary" type="submit">Sign in</button>
      </div>
    </form>
  </dialog>
</body>
</html>
