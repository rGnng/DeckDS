<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeckDS Debug</title>
  <link rel="stylesheet" href="/bootstrap.min.css">
  <link rel="stylesheet" href="/config.css">
  <script defer src="/debug.js"></script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-4 py-md-5">
    <header class="d-flex justify-content-between align-items-center gap-3 border-bottom pb-3 mb-4">
      <img class="deck-logo" src="/logo.svg" alt="DeckDS" width="148" height="44">
      <a class="btn btn-sm btn-outline-secondary" href="/">Web Config</a>
    </header>
    <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1 class="h4 mb-1">Debug</h1>
        <p class="text-body-secondary small mb-0" id="debug-status" role="status">Connecting…</p>
      </div>
      <a class="btn btn-outline-secondary btn-sm" href="/api/debug" download="deckds-debug.json">Download JSON</a>
    </div>
    <div class="row g-3">
      <section class="col-md-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">System</h2>
          <dl id="system-fields" class="debug-fields small mb-0"></dl>
        </div></div>
      </section>
      <section class="col-md-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">Audio</h2>
          <dl id="audio-fields" class="debug-fields small mb-0"></dl>
        </div></div>
      </section>
      <section class="col-md-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">Display &amp; Input</h2>
          <dl id="display-fields" class="debug-fields small mb-0"></dl>
        </div></div>
      </section>
      <section class="col-md-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">Library</h2>
          <dl id="library-fields" class="debug-fields small mb-0"></dl>
        </div></div>
      </section>
      <section class="col-12">
        <div class="card"><div class="card-body">
          <h2 class="h6" id="logs-heading">Recent DeckDS Logs</h2>
          <pre class="debug-log small text-body-secondary bg-body-tertiary border rounded p-3 mb-0"
               id="logs" aria-labelledby="logs-heading" tabindex="0"></pre>
        </div></div>
      </section>
    </div>
  </main>
</body>
</html>
